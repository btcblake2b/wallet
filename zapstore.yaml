# ── Source ─────────────────────────────────────────────────────────────
# Source code repository (shown in the app store / used as NIP-34 reference).
# The APK is fetched automatically from this repo's GitHub Releases assets.
repository: https://github.com/btcblake2b/wallet

# Nostr identity of this app (see docs/zapstore-publish-guide.md)
pubkey: npub1739l83x5lfjgq06t0tlhg4jgkq6d4hvt7kpj7ecg7la9esmh7als56rjy7

# ── Metadata ───────────────────────────────────────────────────────────
name: Btc Blake2b Wallet

summary: Self-custodial Bitcoin wallet for the blake2b network with Lightning support

description: |
  A fully self-custodial Bitcoin wallet for the bitcoin-blake2b network.

  Features:
  - On-chain send and receive (P2WPKH / BIP84), coin control, manual fee bump
    (RBF) and batch send to up to 20 recipients in a single transaction
  - Watch-only xpub, address and UTXO view, private notes per transaction and
    history export (CSV / JSON)
  - Lightning without your own node (experimental, testing phase): an atomic
    swap with a third-party provider, funds stay self-custodial
  - Lightning with your own node: remote control over NWC/NCC (balance,
    channels, fees, payments, diagnostics)
  - Hardware-backed seed storage (Android Keystore), root detection and
    APK integrity self-check
  - 7 languages (EN, IT, DE, FR, ES, FI, ZH) with automatic detection
  - No author server, no analytics, no tracking

  Experimental minority network: use only funds you can afford to lose.
  Not affiliated with the Bitcoin Core project.

tags:
  - bitcoin
  - wallet
  - lightning
  - crypto

# SPDX license identifier
license: MIT

website: https://btcblake2b.org

# ── Media ──────────────────────────────────────────────────────────────
# Path relative to the zsp working directory. If missing, zsp extracts the
# icon from the APK instead.
icon: ./btc_blake2b_logo/export/icon-1024.png

# Screenshot (verticali, 921x2048) mostrati nella scheda dello store.
# ⚠️ Il campo si chiama `images` (NON `screenshots`): zsp li carica sul CDN e
# li espone come tag `image` nell'evento kind 32267.
images:
  - ./screenshots/01-home.png
  - ./screenshots/02-wallet-detail.png
  - ./screenshots/03-lightning.png

# ── Metadata enrichment ────────────────────────────────────────────────
