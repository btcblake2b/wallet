# ═══════════════════════════════════════════════════════════════════
# APP METADATA
# ═══════════════════════════════════════════════════════════════════

# App name (overrides APK label)
name: Btc Blake2b Wallet

# Short one-line description
summary: Bitcoin Lightning wallet with the Blake2b node ecosystem

# Full description (supports markdown)
description: |
  A self-custodial Bitcoin Lightning wallet designed for the Blake2b CLN node ecosystem.
  
  Features:
  - Send & receive Bitcoin via Lightning Network (keysend)
  - Taproot address support (bech32m)
  - Hardware-backed seed storage (Android Keystore)
  - Multi-language: EN, IT, DE, FR, ES, FI, ZH
  - Open source (MIT license)
  
  Built for users who run their own Lightning node and want a seamless wallet experience.

# Category tags
tags:
  - bitcoin
  - wallet
  - lightning
  - nostr
  - finance

# SPDX license identifier
license: MIT

# App homepage
website: https://btcblake2b.org

# Application ID (matches build.gradle.kts)
# Used as the unique identifier for this app on Zapstore
app_id: com.btcblake2b.wallet

