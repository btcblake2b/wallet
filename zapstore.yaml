# ── Metadata ───────────────────────────────────────────────────────────
name: Btc Blake2b Wallet

summary: Self-custodial Bitcoin wallet for the blake2b network with Lightning support

description: |
  A fully self-custodial Bitcoin wallet for the bitcoin-blake2b network.

  Features:
  - On-chain send and receive with Bitcoin Core compatible PSBT handling
  - Lightning Network (experimental): keysend, invoices, payments
  - Remote node control over NWC/NCC: balance, channels, fees, diagnostics
  - Hardware-backed seed storage (Android Keystore), root detection and
    APK integrity self-check
  - Batch send: up to 20 recipients in one transaction, with RBF support
  - Watch-only xpub, coin control and manual fee bump
  - 7 languages (EN, IT, DE, FR, ES, FI, ZH) with automatic detection
  - No author server, no analytics, no tracking

  Experimental minority network: use only funds you can afford to lose.
  Not affiliated with the Bitcoin Core project.

tags:
  - bitcoin
  - wallet
  - lightning
  - crypto

# SPDX license identifier
license: MIT

website: https://btcblake2b.org

# ── Media ──────────────────────────────────────────────────────────────
