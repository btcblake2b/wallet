name: btc_blake2b_wallet
description: Wallet Bitcoin self-custodial per la rete bitcoin-blake2b (mainnet).
publish_to: "none"

version: 0.1.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  bip39: ^1.0.6
  bip32: ^2.0.0
  bech32: ^0.2.2
  crypto: ^3.0.3
  convert: ^3.1.2
  http: ^1.3.0
  uuid: ^4.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  screen_protector: ^1.5.1
  flutter_jailbreak_detection: ^1.10.0
  envied: ^1.3.4
  package_info_plus: ^10.1.0
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.1
  bitcoin_base: ^7.0.0
  blockchain_utils: ^5.4.0
  connectivity_plus: ^7.1.1
  web: ^1.1.0
  go_router: ^14.8.0
  url_launcher: ^6.3.1
  qr: ^3.0.2
  yaml: ^3.1.3
  watcher: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  envied_generator: ^1.1.1
  mocktail: ^1.0.4
  analyzer: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  # Font Outfit locale (P2.2): font variabile [wght] bundlato — niente fetch
  # runtime da Google Fonts, niente FOUT/blocco render/richieste CSP.
  # Copre tutti i pesi 100-900 con un solo file (~108 KB).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
