name: nwc_cln_bridge
description: >-
  Bridge NWC/NCC ↔ Core Lightning: espone un nodo CLN (fork blake2b) via
  Nostr Wallet Connect (NIP-47) e NCC, così l'app Flutter (client NWC/NCC)
  può gestire pagamenti e canali senza modifiche al nodo.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  bip340: ^0.3.0
  # PERCHÉ (P9 swap): stesse versioni dell'app — il digest SIGHASH_UNIFIED e
  # gli script P2WSH devono essere bit-identici sui due lati (provider e app).
  bitcoin_base: ^7.0.0
  blockchain_utils: ^5.4.0
  crypto: ^3.0.3
  http: ^1.3.0
  pointycastle: ^3.9.1
  # PERCHÉ: QR della URI NWC generato server-side (nessun asset/JS esterno
  # nella pagina di stato → privacy e CSP pulita).
  qr: ^3.0.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
